# ==========================================
# 1. DATABASE CONFIGURATION (PostgreSQL)
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/diswallet
spring.datasource.username=pedro
spring.datasource.password=tese2026
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# 2. CLEAN VIEW & LOGGING
# ==========================================
# Disable the large Spring ASCII banner
spring.main.banner-mode=off

# Silence noisy framework logs
logging.level.org.apache.catalina=WARN
logging.level.org.apache.tomcat=WARN
logging.level.org.hibernate=ERROR
logging.level.org.springframework.web=WARN

# ==========================================
# 3. SWAGGER / OPENAPI CONFIGURATION
# ==========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ==========================================
# 4. HSM CONFIGURATION
# ==========================================
wpb.hsm.library=/usr/lib/x86_64-linux-gnu/softhsm/libsofthsm2.so