# Tests use H2 in-memory
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false


# Keep HSM config for tests
wpb.hsm.library=/usr/lib/x86_64-linux-gnu/softhsm/libsofthsm2.so
wpb.hsm.pin=${HSM_PIN:1234}

# Stable test key for disclosure encryption/decryption
wallet.disclosures.encryption-key=MDEyMzQ1Njc4OUFCQ0RFRjAxMjM0NTY3ODlBQkNERUY=

# OpenID4VP test profile: demo-mode enabled so emulator-style request_uri can
# be exercised, with an explicit allow-list of demo verifier identifiers.
wpb.openid4vp.demo-mode=true
wpb.openid4vp.trust.allowed-client-ids=verifier-demo-client,verifier-test-client
wpb.openid4vp.trust.source-mode=hybrid
wpb.openid4vp.trust.remote-allowed-hosts=
wpb.openid4vp.trust.allow-fail-open-in-demo-mode=true
wpb.openid4vp.registry.enabled=false
wpb.openid4vp.registry.specification-version=TS5-1.2
wpb.openid4vp.registry.base-url=
wpb.openid4vp.registry.remote-allowed-hosts=
wpb.openid4vp.registry.connect-timeout-ms=200
wpb.openid4vp.registry.read-timeout-ms=200
wpb.openid4vp.registry.max-cache-age-seconds=60
wpb.openid4vp.registry.verification-key-pem-paths=
wpb.openid4vp.registry.require-signed-responses=true
wpb.openid4vp.registry.require-signed-envelope-fields=true
wpb.openid4vp.registry.allowed-issuers=
wpb.openid4vp.registry.expected-audience=
wpb.openid4vp.registry.clock-skew-seconds=60
wpb.openid4vp.registry.prefer-check-intended-use-endpoint=true
wpb.openid4vp.session.ttl-seconds=600

# OpenID4VCI test profile: simulated adapter, accept any issuer, fast deferred.
wpb.openid4vci.demo-mode=true
wpb.openid4vci.session-ttl-seconds=600
wpb.openid4vci.trust.allowed-issuer-ids=
wpb.openid4vci.policy.allow-mdoc=false
wpb.openid4vci.simulator.always-defer=false
wpb.openid4vci.simulator.deferred-polls-before-issue=1
wpb.openid4vci.sdk.strict-resolution=false
wpb.openid4vci.wia.enabled=true
wpb.openid4vci.wia.reuse-per-issuer=false
wpb.openid4vci.wia.token-ttl-seconds=3600
wpb.openid4vci.wia.min-status-maintenance-days=31
wpb.openid4vci.wia.wallet-name=DI-Swallet-WPB-Test
wpb.openid4vci.wia.wallet-version=test
wpb.openid4vci.wia.wallet-solution-certification-information=test-cert
wpb.openid4vci.ka.enabled=true
wpb.openid4vci.ka.reuse-per-issuer=false
wpb.openid4vci.ka.token-ttl-seconds=3600
wpb.openid4vci.ka.min-status-maintenance-days=31
wpb.openid4vci.ka.key-storage=iso_18045_high
wpb.openid4vci.ka.user-authentication=iso_18045_high
wpb.openid4vci.ka.certification-scheme=eidas
wpb.openid4vci.ka.certification-assurance-level=high
wpb.openid4vci.ka.certification-info=test-cert
wpb.openid4vci.ka.issuer=did:web:test.wpb
wpb.openid4vci.ka.require-x5c=false
wpb.openid4vci.ka.trust-mode=relaxed
wpb.openid4vci.ka.trust-anchor-pem-paths=