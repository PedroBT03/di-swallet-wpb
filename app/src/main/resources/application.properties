# ==========================================
# 1. DATABASE CONFIGURATION (PostgreSQL)
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/diswallet
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:pedro}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:tese2026}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# 2. CLEAN VIEW & LOGGING
# ==========================================
spring.main.banner-mode=off

logging.level.org.apache.catalina=WARN
logging.level.org.apache.tomcat=WARN
logging.level.org.hibernate=ERROR
logging.level.org.springframework.web=WARN

# ==========================================
# 3. SWAGGER / OPENAPI CONFIGURATION
# ==========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ==========================================
# 4. HSM CONFIGURATION
# ==========================================
wpb.hsm.library=/usr/lib/x86_64-linux-gnu/softhsm/libsofthsm2.so
wpb.hsm.pin=${HSM_PIN:1234}

# ==========================================
# 5. FIDO2 / WEBAUTHN CONFIGURATION
# ==========================================
# TODO: PRODUCTION - Replace with registered Wallet Provider domain (e.g., wpb.diswallet.eu)
wallet.rp.id=${WALLET_RP_ID:localhost}
wallet.rp.name=DI-Swallet Wallet Provider

# TODO: PRODUCTION - Replace with production HTTPS origin only
wallet.origins=${WALLET_ORIGINS:http://localhost,http://localhost:8080,https://localhost}

# TODO: PRODUCTION - Set to false and configure MDS for hardware attestation (LoA High)
wallet.allow-untrusted-attestation=${WALLET_ALLOW_UNTRUSTED_ATTESTATION:true}

# Challenge TTL in seconds
wallet.challenge.ttl-seconds=${WALLET_CHALLENGE_TTL_SECONDS:120}

# AES-256 key (Base64, 32 bytes) for at-rest protection of SD-JWT disclosures
wallet.disclosures.encryption-key=${WALLET_DISCLOSURES_ENCRYPTION_KEY:MDEyMzQ1Njc4OUFCQ0RFRjAxMjM0NTY3ODlBQkNERUY=}