# ==========================================
# 0. DEFAULT PROFILE (local development)
# ==========================================
# Mock PID issuance and legacy demo helpers require the dev profile (disabled in prod).
spring.profiles.default=dev

# ==========================================
# 1. DATABASE CONFIGURATION (PostgreSQL)
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/diswallet
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:pedro}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:tese2026}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate (schema owned by Flyway in production)
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# 2. CLEAN VIEW & LOGGING
# ==========================================
spring.main.banner-mode=off

logging.level.org.apache.catalina=WARN
logging.level.org.apache.tomcat=WARN
logging.level.org.hibernate=ERROR
logging.level.org.springframework.web=WARN

# ==========================================
# 3. SWAGGER / OPENAPI CONFIGURATION
# ==========================================
wpb.swagger.enabled=${WPB_SWAGGER_ENABLED:true}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=${WPB_SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${WPB_SWAGGER_ENABLED:true}

# ==========================================
# 3b. OPERATIONS / ACTUATOR
# ==========================================
wpb.ops.trust-snapshot-failure-threshold=${WPB_OPS_TRUST_SNAPSHOT_FAILURE_THRESHOLD:3}
wpb.ops.prometheus-enabled=${WPB_OPS_PROMETHEUS_ENABLED:false}
management.endpoints.web.exposure.include=${WPB_ACTUATOR_EXPOSE:health,info,metrics}
management.endpoint.health.show-details=when_authorized
management.endpoint.health.status.http-mapping.DEGRADED=200
management.info.build.enabled=true
management.prometheus.metrics.export.enabled=${WPB_OPS_PROMETHEUS_ENABLED:false}

# ==========================================
# 4. WALLET LIFECYCLE (Phase 8)
# ==========================================
# Production init requires a registered FIDO2 UserDevice id (WIAM / TS3).
wpb.wallet.require-user-device-on-init=${WPB_WALLET_REQUIRE_USER_DEVICE_ON_INIT:true}

# ==========================================
# 5. HSM CONFIGURATION
# ==========================================
wpb.hsm.library=/usr/lib/x86_64-linux-gnu/softhsm/libsofthsm2.so
wpb.hsm.pin=${HSM_PIN}
wpb.hsm.allow-known-weak-pin=false

# Reject known weak disclosure / transaction-log keys unless explicitly opted in (dev/test).
wpb.security.allow-known-weak-crypto-secrets=false

# ==========================================
# 6. FIDO2 / WEBAUTHN CONFIGURATION
# ==========================================
# TODO: PRODUCTION - Replace with registered Wallet Provider domain (e.g., wpb.diswallet.eu)
wallet.rp.id=${WALLET_RP_ID:localhost}
wallet.rp.name=DI-Swallet Wallet Provider

# TODO: PRODUCTION - Replace with production HTTPS origin only
wallet.origins=${WALLET_ORIGINS:http://localhost,http://localhost:8080,https://localhost}

# TODO: PRODUCTION - Set to false and configure MDS for hardware attestation (LoA High)
wallet.allow-untrusted-attestation=${WALLET_ALLOW_UNTRUSTED_ATTESTATION:true}

# Challenge TTL in seconds
wallet.challenge.ttl-seconds=${WALLET_CHALLENGE_TTL_SECONDS:120}

# AES-256 key (Base64, 32 bytes) for at-rest protection of SD-JWT disclosures
wallet.disclosures.encryption-key=${WALLET_DISCLOSURES_ENCRYPTION_KEY}

# ==========================================
# 7. OPENID4VP
# ==========================================
# Demo mode enables synthetic credential candidates and the local verifier
# emulator fallback parser. NEVER enable in production.
wpb.openid4vp.demo-mode=${WPB_OPENID4VP_DEMO_MODE:false}

# Comma-separated allow-list of accepted verifier client_id values. When
# empty, the trust validator falls back to a permissive baseline acceptable
# only for local protocol validation. Full LoTE-based trust is Phase 5 work.
wpb.openid4vp.trust.allowed-client-ids=${WPB_OPENID4VP_TRUST_ALLOWED_CLIENT_IDS:}
wpb.openid4vp.trust.source-mode=${WPB_OPENID4VP_TRUST_SOURCE_MODE:hybrid}
# Local LoTE/verifier trust material (classpath or file path). The bundled demo
# fixture is for development only — replace with EC-published LoTE in production.
wpb.openid4vp.trust.local-verifiers-path=${WPB_OPENID4VP_TRUST_LOCAL_VERIFIERS_PATH:classpath:trust/demo-lote.json}
wpb.openid4vp.trust.local-trust-anchor-pem-paths=${WPB_OPENID4VP_TRUST_LOCAL_ANCHOR_PEM_PATHS:classpath:trust/demo-anchor.pem}
wpb.openid4vp.trust.remote-trust-url=${WPB_OPENID4VP_TRUST_REMOTE_URL:}
wpb.openid4vp.trust.remote-allowed-hosts=${WPB_OPENID4VP_TRUST_REMOTE_ALLOWED_HOSTS:}
wpb.openid4vp.trust.remote-refresh-interval-seconds=${WPB_OPENID4VP_TRUST_REMOTE_REFRESH_SECONDS:900}
wpb.openid4vp.trust.remote-connect-timeout-ms=${WPB_OPENID4VP_TRUST_REMOTE_CONNECT_TIMEOUT_MS:3000}
wpb.openid4vp.trust.remote-read-timeout-ms=${WPB_OPENID4VP_TRUST_REMOTE_READ_TIMEOUT_MS:5000}
wpb.openid4vp.trust.max-snapshot-age-seconds=${WPB_OPENID4VP_TRUST_MAX_SNAPSHOT_AGE_SECONDS:86400}
# Fail-closed when trust is unavailable, even in demo-mode. Enable only for
# controlled local emulator runs without LoTE material configured.
wpb.openid4vp.trust.allow-fail-open-in-demo-mode=${WPB_OPENID4VP_TRUST_ALLOW_FAIL_OPEN_IN_DEMO_MODE:false}
wpb.openid4vp.registry.enabled=${WPB_OPENID4VP_REGISTRY_ENABLED:false}
wpb.openid4vp.registry.specification-version=${WPB_OPENID4VP_REGISTRY_SPEC_VERSION:TS5-1.2}
wpb.openid4vp.registry.base-url=${WPB_OPENID4VP_REGISTRY_BASE_URL:}
wpb.openid4vp.registry.remote-allowed-hosts=${WPB_OPENID4VP_REGISTRY_REMOTE_ALLOWED_HOSTS:}
wpb.openid4vp.registry.connect-timeout-ms=${WPB_OPENID4VP_REGISTRY_CONNECT_TIMEOUT_MS:3000}
wpb.openid4vp.registry.read-timeout-ms=${WPB_OPENID4VP_REGISTRY_READ_TIMEOUT_MS:5000}
wpb.openid4vp.registry.max-cache-age-seconds=${WPB_OPENID4VP_REGISTRY_MAX_CACHE_AGE_SECONDS:900}
wpb.openid4vp.registry.verification-key-pem-paths=${WPB_OPENID4VP_REGISTRY_VERIFICATION_KEY_PEM_PATHS:}
wpb.openid4vp.registry.require-signed-responses=${WPB_OPENID4VP_REGISTRY_REQUIRE_SIGNED_RESPONSES:true}
wpb.openid4vp.registry.require-signed-envelope-fields=${WPB_OPENID4VP_REGISTRY_REQUIRE_SIGNED_ENVELOPE_FIELDS:true}
wpb.openid4vp.registry.allowed-issuers=${WPB_OPENID4VP_REGISTRY_ALLOWED_ISSUERS:}
wpb.openid4vp.registry.expected-audience=${WPB_OPENID4VP_REGISTRY_EXPECTED_AUDIENCE:}
wpb.openid4vp.registry.clock-skew-seconds=${WPB_OPENID4VP_REGISTRY_CLOCK_SKEW_SECONDS:60}
wpb.openid4vp.registry.prefer-check-intended-use-endpoint=${WPB_OPENID4VP_REGISTRY_PREFER_CHECK_INTENDED_USE_ENDPOINT:true}
wpb.openid4vp.registry.require-privacy-policy-uri=${WPB_OPENID4VP_REGISTRY_REQUIRE_PRIVACY_POLICY_URI:false}

# Session time-to-live in seconds. After expiry, sessions transition to
# EXPIRED on the next read and consent submissions are rejected.
wpb.openid4vp.session.ttl-seconds=${WPB_OPENID4VP_SESSION_TTL_SECONDS:600}

# ==========================================
# 8. MDOC (simulator issuer + presentation)
# ==========================================
# Stable PEM issuer key for dev/CI — NOT an HSM-backed PID Provider key.
wpb.mdoc.issuer-key-pem-path=${WPB_MDOC_ISSUER_KEY_PEM_PATH:classpath:mdoc/dev-issuer-key.pem}
wpb.mdoc.auto-generate-issuer-key-if-missing=${WPB_MDOC_AUTO_GENERATE_ISSUER_KEY:false}
# legacy-aud-nonce | openid4vp | hybrid
wpb.mdoc.session-transcript-mode=${WPB_MDOC_SESSION_TRANSCRIPT_MODE:legacy-aud-nonce}
wpb.mdoc.require-holder-key-alias=${WPB_MDOC_REQUIRE_HOLDER_KEY_ALIAS:true}

# ==========================================
# 9. OPENID4VCI
# ==========================================
# Demo mode wires the in-process simulated adapter (no real issuer contact).
# Set to false to activate the real SDK-backed adapter (deferred to Phase 3
# in this MVP increment).
wpb.openid4vci.demo-mode=${WPB_OPENID4VCI_DEMO_MODE:true}

# Lifetime of an issuance session in seconds.
wpb.openid4vci.session-ttl-seconds=${WPB_OPENID4VCI_SESSION_TTL_SECONDS:1800}

# Allow-list of issuer identifiers (empty + demo-mode=true accepts any).
wpb.openid4vci.trust.allowed-issuer-ids=${WPB_OPENID4VCI_TRUST_ALLOWED_ISSUER_IDS:}
wpb.openid4vci.trust.clock-skew-seconds=${WPB_OPENID4VCI_TRUST_CLOCK_SKEW_SECONDS:60}

# Policy gate for mdoc credential issuance.
wpb.openid4vci.policy.allow-mdoc=${WPB_OPENID4VCI_POLICY_ALLOW_MDOC:false}

# Simulator knobs (no effect when demo-mode=false).
wpb.openid4vci.simulator.always-defer=${WPB_OPENID4VCI_SIMULATOR_ALWAYS_DEFER:false}
wpb.openid4vci.simulator.deferred-polls-before-issue=${WPB_OPENID4VCI_SIMULATOR_DEFERRED_POLLS:1}

# SDK adapter knobs.
wpb.openid4vci.sdk.credential-issuer-id=${WPB_OPENID4VCI_SDK_CREDENTIAL_ISSUER_ID:}
wpb.openid4vci.sdk.dpop-mode=${WPB_OPENID4VCI_SDK_DPOP_MODE:supported}
wpb.openid4vci.sdk.metadata-policy=${WPB_OPENID4VCI_SDK_METADATA_POLICY:preferSigned}
wpb.openid4vci.sdk.pkce-required=${WPB_OPENID4VCI_SDK_PKCE_REQUIRED:true}
wpb.openid4vci.sdk.use-par-when-supported=${WPB_OPENID4VCI_SDK_USE_PAR_WHEN_SUPPORTED:true}
wpb.openid4vci.sdk.strict-resolution=${WPB_OPENID4VCI_SDK_STRICT_RESOLUTION:true}

# WIA (Wallet Instance Attestation) knobs.
wpb.openid4vci.wia.enabled=${WPB_OPENID4VCI_WIA_ENABLED:true}
wpb.openid4vci.wia.token-ttl-seconds=${WPB_OPENID4VCI_WIA_TOKEN_TTL_SECONDS:21600}
wpb.openid4vci.wia.min-status-maintenance-days=${WPB_OPENID4VCI_WIA_MIN_STATUS_DAYS:31}
wpb.openid4vci.wia.reuse-per-issuer=${WPB_OPENID4VCI_WIA_REUSE_PER_ISSUER:false}
wpb.openid4vci.wia.wallet-name=${WPB_OPENID4VCI_WIA_WALLET_NAME:DI-Swallet-WPB}
wpb.openid4vci.wia.wallet-version=${WPB_OPENID4VCI_WIA_WALLET_VERSION:0.1.0}
wpb.openid4vci.wia.wallet-link=${WPB_OPENID4VCI_WIA_WALLET_LINK:}
wpb.openid4vci.wia.wallet-solution-certification-information=${WPB_OPENID4VCI_WIA_CERT_INFO:thesis-mvp-not-certified}
wpb.openid4vci.wia.signing-x5c=${WPB_OPENID4VCI_WIA_SIGNING_X5C:}
wpb.openid4vci.wia.max-nonce-mismatch-retries=${WPB_OPENID4VCI_WIA_MAX_NONCE_RETRIES:1}
wpb.openid4vci.wia.max-expired-retries=${WPB_OPENID4VCI_WIA_MAX_EXPIRED_RETRIES:1}

# KA (Key Attestation) knobs.
wpb.openid4vci.ka.enabled=${WPB_OPENID4VCI_KA_ENABLED:true}
wpb.openid4vci.ka.token-ttl-seconds=${WPB_OPENID4VCI_KA_TOKEN_TTL_SECONDS:21600}
wpb.openid4vci.ka.min-status-maintenance-days=${WPB_OPENID4VCI_KA_MIN_STATUS_DAYS:31}
wpb.openid4vci.ka.reuse-per-issuer=${WPB_OPENID4VCI_KA_REUSE_PER_ISSUER:false}
wpb.openid4vci.ka.key-storage=${WPB_OPENID4VCI_KA_KEY_STORAGE:iso_18045_high}
wpb.openid4vci.ka.user-authentication=${WPB_OPENID4VCI_KA_USER_AUTHENTICATION:iso_18045_high}
wpb.openid4vci.ka.certification-scheme=${WPB_OPENID4VCI_KA_CERT_SCHEME:eidas}
wpb.openid4vci.ka.certification-assurance-level=${WPB_OPENID4VCI_KA_CERT_LEVEL:high}
wpb.openid4vci.ka.certification-info=${WPB_OPENID4VCI_KA_CERT_INFO:thesis-mvp-not-certified}
wpb.openid4vci.ka.issuer=${WPB_OPENID4VCI_KA_ISSUER:did:web:wpb.local}
wpb.openid4vci.ka.signing-x5c=${WPB_OPENID4VCI_KA_SIGNING_X5C:}
wpb.openid4vci.ka.require-configured-signing-chain=${WPB_OPENID4VCI_KA_REQUIRE_CONFIGURED_SIGNING_CHAIN:false}
wpb.openid4vci.ka.enforce-production-trust-policy=${WPB_OPENID4VCI_KA_ENFORCE_PRODUCTION_TRUST_POLICY:false}
wpb.openid4vci.ka.require-x5c=${WPB_OPENID4VCI_KA_REQUIRE_X5C:false}
wpb.openid4vci.ka.allowed-x5c-fingerprints=${WPB_OPENID4VCI_KA_ALLOWED_X5C_FINGERPRINTS:}
# relaxed | strict. Outside demo-mode, relaxed is upgraded to strict unless fingerprints or trust anchors are configured.
wpb.openid4vci.ka.trust-mode=${WPB_OPENID4VCI_KA_TRUST_MODE:relaxed}
wpb.openid4vci.ka.trust-anchor-pem-paths=${WPB_OPENID4VCI_KA_TRUST_ANCHOR_PEM_PATHS:}
# When demo-mode=false, configure ka.signing-x5c with the Wallet Provider certificate chain.

# ==========================================
# 10. STATUS LIST / REVOCATION
# ==========================================
wpb.status-list.capacity=${WPB_STATUS_LIST_CAPACITY:131072}
wpb.status-list.signing-key-pem-path=${WPB_STATUS_LIST_SIGNING_KEY_PEM:classpath:status-list/dev-signing-key.pem}
wpb.status-list.auto-generate-signing-key-if-missing=true
wpb.status-list.jwt-ttl-seconds=${WPB_STATUS_LIST_JWT_TTL_SECONDS:86400}
wpb.status-list.sync-cron=${WPB_STATUS_LIST_SYNC_CRON:0 0 * * * *}
wpb.status-list.public-base-url=${WPB_STATUS_LIST_PUBLIC_BASE_URL:http://localhost:8080/api/v1/wallet/status-lists}

# ==========================================
# 11. TRANSACTION LOG (TS10)
# ==========================================
wpb.transaction-log.encryption-key=${WPB_TRANSACTION_LOG_ENCRYPTION_KEY}
wpb.transaction-log.integrity-key=${WPB_TRANSACTION_LOG_INTEGRITY_KEY}
wpb.transaction-log.dek-mode=${WPB_TRANSACTION_LOG_DEK_MODE:server}
wpb.wsca.enforce-sci-boundary=${WPB_WSCA_ENFORCE_SCI_BOUNDARY:true}
wpb.transaction-log.ts10-schema-version=1.2
wpb.transaction-log.retention-days=${WPB_TRANSACTION_LOG_RETENTION_DAYS:365}
wpb.transaction-log.max-entries-per-holder=${WPB_TRANSACTION_LOG_MAX_ENTRIES:10000}
wpb.transaction-log.retention-grace-days=${WPB_TRANSACTION_LOG_GRACE_DAYS:30}
wpb.transaction-log.retention-cron=${WPB_TRANSACTION_LOG_RETENTION_CRON:0 30 2 * * *}

# ==========================================
# 12. DATA DELETION REQUESTS (Phase 11 / TS7)
# ==========================================
wpb.data-deletion.mail-subject=${WPB_DATA_DELETION_MAIL_SUBJECT:Request for erasure of personal data under Article 17 GDPR (EU) 2016/679}
wpb.data-deletion.registry-lookup-notice=${WPB_DATA_DELETION_REGISTRY_NOTICE:No deletion contact was stored for this presentation. Registry lookup was used to obtain current support contacts.}

# ==========================================
# 13. DPA REPORTING
# ==========================================
# Provider fallback DPA is required in production to satisfy RPT_DPA_01 when log/registry lack contacts.
wpb.dpa-reporting.provider-fallback-dpa.name=${WPB_DPA_FALLBACK_NAME:}
wpb.dpa-reporting.provider-fallback-dpa.country=${WPB_DPA_FALLBACK_COUNTRY:}
wpb.dpa-reporting.provider-fallback-dpa.email=${WPB_DPA_FALLBACK_EMAIL:}
wpb.dpa-reporting.provider-fallback-dpa.phone=${WPB_DPA_FALLBACK_PHONE:}
wpb.dpa-reporting.provider-fallback-dpa.form-uri=${WPB_DPA_FALLBACK_FORM_URI:}
wpb.dpa-reporting.registry-lookup-notice=${WPB_DPA_REGISTRY_NOTICE:No DPA contact was stored for this presentation. Registry lookup was used to obtain current supervisory authority contacts.}
wpb.dpa-reporting.no-contact-notice=${WPB_DPA_NO_CONTACT_NOTICE:No DPA contact channel is available. Configure wpb.dpa-reporting.provider-fallback-dpa.* for production fallback (RPT_DPA_01).}

# ==========================================
# 14. TRUST MARK
# ==========================================
wpb.trust-mark.enabled=${WPB_TRUST_MARK_ENABLED:false}
wpb.trust-mark.trust-mark-resource-url=${WPB_TRUST_MARK_RESOURCE_URL:}
wpb.trust-mark.list-of-certified-wallets-url=${WPB_TRUST_MARK_LIST_URL:}
wpb.trust-mark.wallet-solution-info-page-url=${WPB_TRUST_MARK_INFO_PAGE_URL:}
wpb.trust-mark.wallet-solution-id=${WPB_TRUST_MARK_SOLUTION_ID:}
wpb.trust-mark.cache-ttl-seconds=${WPB_TRUST_MARK_CACHE_TTL:3600}
wpb.trust-mark.default-language=${WPB_TRUST_MARK_DEFAULT_LANG:en}
wpb.trust-mark.allow-admin-refresh=${WPB_TRUST_MARK_ALLOW_ADMIN_REFRESH:false}

# ==========================================
# 15. PRIVACY CONTROLS / CONSENT
# ==========================================
wpb.consent.enabled=${WPB_CONSENT_ENABLED:true}
wpb.consent.require-fido2-on-submit=${WPB_CONSENT_REQUIRE_FIDO2:true}
wpb.consent.enforce-all-or-nothing=${WPB_CONSENT_ALL_OR_NOTHING:true}
wpb.consent.require-explicit-credential-choice=${WPB_CONSENT_EXPLICIT_CHOICE:true}
wpb.consent.issuance.enabled=${WPB_ISSUANCE_CONSENT_ENABLED:true}
wpb.consent.issuance.pending-ttl-seconds=${WPB_ISSUANCE_CONSENT_TTL:600}

# ==========================================
# 16. PSEUDONYMS
# ==========================================
wpb.pseudonym.enabled=${WPB_PSEUDONYM_ENABLED:false}
wpb.pseudonym.max-per-rp=${WPB_PSEUDONYM_MAX_PER_RP:10}
wpb.pseudonym.allowed-rp-ids=${WPB_PSEUDONYM_ALLOWED_RP_IDS:}
wpb.pseudonym.user-handle-entropy-bytes=${WPB_PSEUDONYM_USER_HANDLE_BYTES:32}
wpb.pseudonym.challenge-ttl-seconds=${WPB_PSEUDONYM_CHALLENGE_TTL:300}
wpb.pseudonym.log-include-alias-in-export=${WPB_PSEUDONYM_LOG_ALIAS:false}