name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-conformance:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install SoftHSM2
        run: |
          sudo apt-get update
          sudo apt-get install -y softhsm2 opensc

      - name: Initialize SoftHSM2 token
        run: |
          mkdir -p "$HOME/softhsm/tokens"
          cat > "$HOME/.softhsm2.conf" <<EOF
          directories.tokendir = $HOME/softhsm/tokens
          objectstore.backend = file
          EOF
          printf '123456\n1234\n' | softhsm2-util --init-token --free --label "DI-Swallet-WSCD" --pin 1234 --so-pin 123456

      - name: Run full test suite
        run: ./gradlew :app:test --no-daemon

      - name: Run conformance suite and generate report
        run: ./gradlew :app:conformanceTest --no-daemon

      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: app/build/reports/conformance/

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: app/build/reports/jacoco/

  performance:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Install SoftHSM2
        run: |
          sudo apt-get update
          sudo apt-get install -y softhsm2 opensc
      - name: Initialize SoftHSM2 token
        run: |
          mkdir -p "$HOME/softhsm/tokens"
          cat > "$HOME/.softhsm2.conf" <<EOF
          directories.tokendir = $HOME/softhsm/tokens
          objectstore.backend = file
          EOF
          printf '123456\n1234\n' | softhsm2-util --init-token --free --label "DI-Swallet-WSCD" --pin 1234 --so-pin 123456
      - name: Run performance smoke tests
        run: ./gradlew :app:performanceTest --no-daemon

  external-interop:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Install SoftHSM2
        run: |
          sudo apt-get update
          sudo apt-get install -y softhsm2 opensc
      - name: Initialize SoftHSM2 token
        run: |
          mkdir -p "$HOME/softhsm/tokens"
          cat > "$HOME/.softhsm2.conf" <<EOF
          directories.tokendir = $HOME/softhsm/tokens
          objectstore.backend = file
          EOF
          printf '123456\n1234\n' | softhsm2-util --init-token --free --label "DI-Swallet-WSCD" --pin 1234 --so-pin 123456
      - name: Run external interop tests (env-gated)
        env:
          WPB_REAL_ISSUER_ENABLED: ${{ secrets.WPB_REAL_ISSUER_ENABLED }}
          WPB_REAL_ISSUER_OFFER_URI: ${{ secrets.WPB_REAL_ISSUER_OFFER_URI }}
          WPB_REAL_REGISTRY_ENABLED: ${{ secrets.WPB_REAL_REGISTRY_ENABLED }}
          WPB_REAL_REGISTRY_BASE_URL: ${{ secrets.WPB_REAL_REGISTRY_BASE_URL }}
          WPB_REAL_REGISTRY_RP_IDENTIFIER: ${{ secrets.WPB_REAL_REGISTRY_RP_IDENTIFIER }}
          WPB_REAL_REGISTRY_VERIFICATION_KEY_PEM_PATHS: ${{ secrets.WPB_REAL_REGISTRY_VERIFICATION_KEY_PEM_PATHS }}
        run: ./gradlew :app:externalInteropTest --no-daemon
