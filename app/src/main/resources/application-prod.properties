# Production profile - activate with SPRING_PROFILES_ACTIVE=prod
# Secrets must be supplied via environment variables (see ops/deployment-checklist.md).

spring.jpa.show-sql=false
logging.level.root=INFO

# Disable interactive API docs in production (re-enable only behind admin VPN if needed).
wpb.swagger.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Demo / dev-only features must be off (also enforced by ProductionReadinessValidator).
wpb.openid4vp.demo-mode=false
wpb.openid4vci.demo-mode=false
wallet.allow-untrusted-attestation=false
wpb.openid4vci.ka.enforce-production-trust-policy=true

# Actuator: expose health, info, metrics; enable Prometheus when scraping is configured.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
wpb.ops.prometheus-enabled=true
management.prometheus.metrics.export.enabled=true

# Status list signing key must be provisioned - never auto-generate in prod.
wpb.status-list.auto-generate-signing-key-if-missing=false
wpb.status-list.signing-key-pem-path=${WPB_STATUS_LIST_SIGNING_KEY_PEM_PATH}
wpb.mdoc.auto-generate-issuer-key-if-missing=false
wpb.mdoc.issuer-key-pem-path=${WPB_MDOC_ISSUER_KEY_PEM_PATH}

# Trust mark admin refresh must stay disabled unless explicitly operated.
wpb.trust-mark.allow-admin-refresh=false

# Holder-held transaction log DEKs: WPB cannot decrypt payloads without X-Wallet-Log-Key from WPI.
wpb.transaction-log.dek-mode=holder

# Enforce WI→WSCA SCI boundary (FIDO2 or consent-scoped grant before HSM signing/keygen).
wpb.wsca.enforce-sci-boundary=true

# Provider-region DPA fallback must expose at least one contact channel (email, phone, or form URI).
wpb.dpa-reporting.provider-fallback-dpa.email=${WPB_DPA_FALLBACK_EMAIL:}
wpb.dpa-reporting.provider-fallback-dpa.phone=${WPB_DPA_FALLBACK_PHONE:}
wpb.dpa-reporting.provider-fallback-dpa.form-uri=${WPB_DPA_FALLBACK_FORM_URI:}
