# Local SoftHSM demo token (see README). Never use in staging/production.
wpb.hsm.pin=${HSM_PIN:1234}

# wpi-dev lab UI origin: http://localhost:5173 (see wallet.origins in application.properties)
wpb.hsm.allow-known-weak-pin=true

# Required for local verifier-emulator flows from wpi-dev (PKIX trust still enforced).
wpb.openid4vp.demo-mode=true

# OpenID4VP local emulator: secondary allow-list for verifier-demo-client.
# Trust still requires PKIX + cert_sha256 from verifier_info.x5c (see verifier-emulator/trust/).
wpb.openid4vp.trust.allowed-client-ids=verifier-demo-client,verifier-test-client

# Demo verifier privacy contacts for GDPR deletion requests when RP registry is disabled.
wpb.data-deletion.provider-fallback-rp.country=PT
wpb.data-deletion.provider-fallback-rp.email=privacy@demo-verifier.local
wpb.data-deletion.provider-fallback-rp.web-uri=http://localhost:8081/privacy

# Demo DPA reporting fallback (RPT_DPA_01 / TS8) for wpi-dev Privacy → Initiate report.
# DUMMY ONLY: not a real CNPD (or any DPA) mailbox — do not send real complaints here.
# Why dummy is required in dev: verifier-emulator presentations do not persist supervisoryAuthority
# contacts in the TS10 log, and RP registry lookup is usually off (wpb.openid4vp.registry.enabled=false),
# so without a provider-region fallback the DPA report flow has no email/web/phone channel to offer.
# In production, configure real DPA contacts from presentation logs, the national WRP registry, or
# the Wallet Provider's jurisdiction fallback (ProductionReadinessValidator enforces this in prod).
wpb.dpa-reporting.provider-fallback-dpa.name=CNPD (demo only)
wpb.dpa-reporting.provider-fallback-dpa.country=PT
wpb.dpa-reporting.provider-fallback-dpa.email=dpa-demo@local.test

# Documented weak crypto defaults for local demos only.
wpb.security.allow-known-weak-crypto-secrets=true
wallet.disclosures.encryption-key=${WALLET_DISCLOSURES_ENCRYPTION_KEY:MDEyMzQ1Njc4OUFCQ0RFRjAxMjM0NTY3ODlBQkNERUY=}
wpb.transaction-log.encryption-key=${WPB_TRANSACTION_LOG_ENCRYPTION_KEY:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=}
wpb.transaction-log.integrity-key=${WPB_TRANSACTION_LOG_INTEGRITY_KEY:YmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmJiYmI=}
